# Replace ntuple.example.com before installing. Certbot adds the TLS listener.
# Install inside /etc/nginx/sites-available/jev-ntuple (included in http context).
limit_req_zone $binary_remote_addr zone=ntuple_requests:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=ntuple_connections:10m;
server {
    listen 80;
    server_name ntuple.example.com;
    client_max_body_size 1k;
    client_body_timeout 5s;
    client_header_timeout 5s;
    send_timeout 10s;
    access_log off;
    location = /health { proxy_pass http://127.0.0.1:7860; proxy_read_timeout 5s; }
    location = /ready { proxy_pass http://127.0.0.1:7860; proxy_read_timeout 5s; }
    location = /v1/evaluate {
        limit_except POST { deny all; }
        limit_req zone=ntuple_requests burst=8 nodelay;
        limit_req_status 429;
        limit_conn ntuple_connections 8;
        proxy_connect_timeout 2s;
        proxy_send_timeout 5s;
        proxy_read_timeout 8s;
        proxy_request_buffering on;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_pass http://127.0.0.1:7860;
    }
    location / { return 404; }
}
